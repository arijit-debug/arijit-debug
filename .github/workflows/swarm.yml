name: Rebuild README swarm

on:
  # profile edits rebuild at once (push below); new commits in other repos
  # are picked up by this check every 15 minutes, which only commits when
  # something changed
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [swarm.config.json, assets/portrait.txt, assets/avatar.png, .github/workflows/swarm.yml]

permissions:
  contents: write

concurrency:
  group: readme-swarm
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: arijit-debug/readme-swarm@v1.0.1
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- README.md assets/swarm; then
            echo "No changes"
            exit 0
          fi
          git config user.name "readme-swarm[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/swarm
          git commit -m "Rebuild README swarm"
          git push
